name: kirians_filter

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # Apply DB migrations, then start the bot.
    command: sh -c "rm -f /tmp/kirians-filter.ready && alembic upgrade head && python main.py"
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/kirians-filter.ready').exists()"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Порт доступен только с самого сервера (127.0.0.1), не из интернета.
    # Подключение снаружи — через SSH-туннель (см. README, раздел про TablePlus).
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
